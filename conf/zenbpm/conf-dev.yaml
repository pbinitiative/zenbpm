name: zenbpm
httpServer:
  context: /
  addr: :8080
grpcServer:
  addr: :9090
jobManager:
  defaultLockDurationMs: 30000 #30s
  maxLockDurationMs: 86400000 #24h
  defaultMaxActiveJobs: 10
  maxActiveJobsCap: 1000
jobs:
  defaultRetries: 1 # one attempt: the first failure without an error code creates an incident
  maxRetries: 100
  defaultRetryBackoff: PT0S # ISO-8601 duration or a comma-separated list, one entry per failure
  maxRetryBackoff: PT24H
cluster:
  addr: localhost:8090
  adv: localhost:8090
  raft:
    dir: node-1
    bootstrapExpect: 1
    bootstrapExpectTimeout: 30m
    joinAttempts: 5
    joinAddresses:
      - localhost:8090
  nodeId: node-1
  script:
    feel:
      maxVmPoolSize: 10
      minVmPoolSize: 2
    js:
      maxVmPoolSize: 10
      minVmPoolSize: 2
