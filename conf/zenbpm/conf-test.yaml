name: zenbpm
httpServer:
  context: /
  addr: :8080
grpcServer:
  addr: :9090
jobManager:
  defaultLockDurationMs: 30000 #30s
  maxLockDurationMs: 86400000 #24h
  defaultMaxActiveJobs: 10
  maxActiveJobsCap: 1000
cluster:
  addr: localhost:8090
  adv: localhost:8090
  raft:
    dir: test-node-1
    bootstrapExpect: 1
    bootstrapExpectTimeout: 30m
    joinAttempts: 5
    joinAddresses:
      - localhost:8090
  nodeId: test-node-1
  script:
    feel:
      maxVmPoolSize: 10
      minVmPoolSize: 2
    js:
      maxVmPoolSize: 10
      minVmPoolSize: 2
