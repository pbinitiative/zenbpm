<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200" role="img" aria-label="Approval process: Request received, then Approve request user task, then Done">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- card background so the diagram is legible on light and dark pages -->
  <rect x="4" y="4" width="512" height="192" rx="10" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>

  <!-- Start event -->
  <circle cx="72" cy="86" r="18" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="72" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333">Request received</text>

  <!-- flow 1 -->
  <line x1="90" y1="86" x2="168" y2="86" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User task -->
  <rect x="174" y="51" width="130" height="70" rx="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <!-- user-task glyph (person) top-left -->
  <circle cx="190" cy="66" r="3.4" fill="none" stroke="#555555" stroke-width="1.4"/>
  <path d="M184 76 a6 6 0 0 1 12 0" fill="none" stroke="#555555" stroke-width="1.4"/>
  <text x="239" y="91" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333">Approve request</text>

  <!-- flow 2 -->
  <line x1="304" y1="86" x2="396" y2="86" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- End event -->
  <circle cx="420" cy="86" r="18" fill="#ffffff" stroke="#333333" stroke-width="4"/>
  <text x="420" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#333333">Done</text>
</svg>
