edition = "2023";
package zencommand;

option go_package = "github.com/pbinitiative/zenbpm/internal/cluster/command/proto";

message Command {
  enum Type {
    TYPE_UNKNOWN = 0;
    TYPE_NOOP = 1;
    TYPE_NODE_CHANGE = 2;
    TYPE_NODE_PARTITION_CHANGE = 3;
    TYPE_CLUSTER_MAINTENANCE_CHANGE = 4;
    TYPE_PROCESS_DEFINITION_ALLOCATION = 5;
  }
  Type type = 1;
  oneof request {
    NodeChange node_change = 2;
    NodePartitionChange node_partition_change = 3;
    ClusterMaintenanceChange cluster_maintenance_change = 4;
    ProcessDefinitionAllocation process_definition_allocation = 5;
  }
}

enum Role {
  ROLE_TYPE_UNKNOWN = 0;
  ROLE_TYPE_FOLLOWER = 1;
  ROLE_TYPE_LEADER = 2;
}

enum NodeState {
  NODE_STATE_UNKNOWN = 0;
  NODE_STATE_ERROR = 1;
  NODE_STATE_STARTED = 2;
  NODE_STATE_SHUTDOWN = 3;
}

enum RaftSuffrage {
  RAFT_SUFFRAGE_UNKNOWN = 0;
  RAFT_SUFFRAGE_VOTER = 1;
  RAFT_SUFFRAGE_NONVOTER = 2;
}

message NodeChange {
  string node_id = 1;  // node which changed
  string addr = 2;
  RaftSuffrage suffrage = 3;
  NodeState state = 4;
  Role role = 5;
}


// Partition state transition
// JOINING - cluster leader determined that a node needs to be part of the partition group and node needs to perform joining operation on the group
//    ↓
// INITIALIZING - node has started the process of joining the partition group (this can take longer if rqlite has a lot of data stored)
//    ↓
// INITIALIZED - node has joined the partition group
//
// LEAVING - node has to leave the partition group
enum NodePartitionState {
  NODE_PARTITION_STATE_UNKNOWN = 0;
  NODE_PARTITION_STATE_ERROR = 1;
  NODE_PARTITION_STATE_JOINING = 2;
  NODE_PARTITION_STATE_LEAVING = 3;
  NODE_PARTITION_STATE_INITIALIZING = 4;
  NODE_PARTITION_STATE_INITIALIZED = 5;
}

message NodePartitionChange {
  string node_id = 1;       // node which changed
  uint32 partition_id = 2;  // partition id which changed on node
  NodePartitionState state = 3;
  Role role = 4;
}

// ClusterMaintenanceChange carries a cluster-wide maintenance operation.
// Field 1 is the plain "restoring" flag written by earlier binaries. It is
// only read when replaying such logs: a true flag is migrated into a gated
// legacy restore operation (see state.Cluster.ApplyLegacyRestoringFlag), a
// false flag completes it. New binaries never write it.
message ClusterMaintenanceChange {
  bool restoring = 1 [deprecated = true];
  RestoreOperationChange restore = 2;
}

// RestorePhase mirrors state.RestorePhase; it tracks how far a restore got.
enum RestorePhase {
  RESTORE_PHASE_UNKNOWN = 0;
  RESTORE_PHASE_PENDING = 1;
  RESTORE_PHASE_QUIESCING = 2;
  RESTORE_PHASE_VALIDATING = 3;
  RESTORE_PHASE_LOADING = 4;
  RESTORE_PHASE_RECONCILING = 5;
  RESTORE_PHASE_RESUMING = 6;
  RESTORE_PHASE_DONE = 7;
}

// RestoreOperationChange is applied atomically by the FSM. Every action is
// fenced by (operation_id, epoch): only the coordinator that acquired the
// operation, and only while its epoch is current, can advance it.
message RestoreOperationChange {
  enum Action {
    RESTORE_ACTION_UNKNOWN = 0;
    // ACQUIRE starts a new operation. It is rejected while another operation
    // is active and its lease has not expired.
    RESTORE_ACTION_ACQUIRE = 1;
    // UPDATE advances the phase / progress of the owned operation and renews
    // its lease.
    RESTORE_ACTION_UPDATE = 2;
    // COMPLETE marks the owned operation as successfully finished.
    RESTORE_ACTION_COMPLETE = 3;
    // FAIL marks the owned operation as failed with an error.
    RESTORE_ACTION_FAIL = 4;
    // ABORT terminates the operation identified by operation_id regardless of
    // its owner (operator decision); it lifts the cluster gate.
    RESTORE_ACTION_ABORT = 5;
  }
  Action action = 1;
  string operation_id = 2;
  // epoch of the owned operation (UPDATE/COMPLETE/FAIL). Ignored by ACQUIRE
  // (the FSM assigns the next epoch) and by ABORT.
  uint64 epoch = 3;
  string coordinator_id = 4;
  RestorePhase phase = 5;
  uint32 total_partitions = 6;
  uint32 completed_partitions = 7;
  string error = 8;
  bool force = 9;
  // timestamp_millis is the writer's clock; the FSM never reads the wall clock
  // so that every replica applies the command identically.
  int64 timestamp_millis = 10;
  // lease_millis is how long the coordinator's ownership stays valid without
  // a further UPDATE (ACQUIRE and UPDATE).
  int64 lease_millis = 11;
}

// ProcessDefinitionAllocation asks the FSM for the cluster-wide identity of
// one BPMN deployment: the numeric version and the definition key that every
// partition must store for the given process. The FSM applies it
// deterministically (see state.Cluster.AllocateProcessDefinition): a request
// whose checksum matches the latest allocation of the process, or an
// allocation whose deployment was never confirmed, returns that allocation
// unchanged, so retries and concurrent identical deployments converge on one
// definition; anything else becomes the next version under a key the FSM
// derives from the command. ACTION_CONFIRM marks an allocation as deployed to
// every partition once the fan-out succeeded.
message ProcessDefinitionAllocation {
  enum Action {
    ACTION_UNKNOWN = 0;
    ACTION_ALLOCATE = 1;
    ACTION_CONFIRM = 2;
  }
  // action defaults to ACTION_ALLOCATE.
  Action action = 1;
  string process_id = 2;
  // checksum is the hex MD5 of the raw BPMN bytes (ACTION_ALLOCATE).
  string checksum = 3;
  string version_tag = 4;
  // observed_latest is the latest definition of the process the requesting
  // node read from a partition. It lets the FSM catch up with definitions
  // deployed before allocations were replicated; the FSM never moves backwards.
  ObservedProcessDefinition observed_latest = 5;
  // timestamp_millis is the writer's clock; the FSM never reads the wall
  // clock so that every replica applies the command identically. The key of
  // a new version is derived from it and the raft log index of the command.
  int64 timestamp_millis = 6;
  // key identifies the allocation ACTION_CONFIRM refers to.
  int64 key = 7;
}

// ObservedProcessDefinition is a definition as it exists on a partition.
message ObservedProcessDefinition {
  int64 key = 1;
  int32 version = 2;
  string checksum = 3;
  string version_tag = 4;
}
