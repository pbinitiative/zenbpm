openapi: 3.0.0

# Operational-plane API specification.
#
# Convention: /v1/** is the business API (see api.yaml, served by generated
# handlers); /system is the operational plane, hand-registered in
# internal/rest/server.go. Unversioned probes sit directly under /system and
# must stay stable for Kubernetes probes and Prometheus scrapers; operational
# APIs that carry payload contracts are versioned under /system/v1/....
#
# This spec is DOCUMENTATION for those hand-registered handlers — no server
# code is generated from it. Keep it in sync with internal/rest/server.go,
# internal/rest/cluster_status.go and internal/rest/cluster_backup.go.

info:
  title: ZenBPM System OpenAPI
  description: Operational REST API for ZenBPM (health, metrics, backup & restore)
  version: 1.0.0
  contact:
    name: API Support
    email: info@pbinitiative.org
  license:
    name: AGPL
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: http://localhost:8080
  - url: http://localhost:8081
  - url: http://localhost:8082
  - url: http://zenbpm.local

tags:
  - name: system
  - name: cluster-backup

paths:
  /system/status:
    get:
      operationId: getClusterStatus
      summary: Cluster status and node health
      description: |
        Verbose diagnostic endpoint. Returns the cluster topology as seen by
        the responding node, the node's build information, its own health
        evaluation and — once a restore was ever run — the current or most
        recent restore operation.

        This endpoint always answers `200`, even when `health.ok` is false;
        it keeps the legacy contract for existing consumers. Readiness
        semantics (`503` while not ready) live exclusively on
        `/system/health/ready`.

        Note: `nodes.*.addr` is the node's internal cluster (raft) address, not
        its HTTP address — map the node to its HTTP base URL through your
        deployment configuration.
      tags:
        - system
      responses:
        "200":
          description: Cluster status as seen by the responding node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatus"
        "500":
          description: The status document could not be rendered.

  /system/health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      description: |
        Reports only that the process is up and serving HTTP. It deliberately
        does not look at raft state so that a leaderless node is not restarted
        in a loop by an orchestrator. Always `200` with `status: "UP"`.
      tags:
        - system
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /system/health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      description: |
        `200` with `status: "UP"` when the node sees a cluster leader, is
        registered in the cluster state and every partition assigned to it is
        INITIALIZED; `503` with `status: "DOWN"` and the reasons otherwise.
        Cluster-wide partition health is deliberately excluded so that a
        degraded remote partition does not remove the whole cluster from a
        load balancer.
      tags:
        - system
      responses:
        "200":
          description: The node is ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The node is not ready; `reasons` says why.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /system/metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: Metrics in the Prometheus text exposition format.
      tags:
        - system
      responses:
        "200":
          description: Prometheus exposition payload.
          content:
            text/plain:
              schema:
                type: string

  /system/v1/cluster/backup:
    get:
      operationId: downloadClusterBackup
      summary: Stream a whole-cluster backup bundle
      description: |
        Streams a plain tar archive containing one gzipped SQLite snapshot per
        partition (`partition-<id>.db.gz`) followed by `manifest.json` as the
        last entry. Callable on any node; the responding node coordinates and
        pulls snapshots from each partition leader. Non-blocking: the cluster
        keeps serving traffic during the backup.

        Failures after streaming has begun surface as a truncated archive
        (missing `manifest.json`); a restore rejects such a bundle, so simply
        retry the download.
      tags:
        - cluster-backup
      responses:
        "200":
          description: |
            The backup bundle. Sent with
            `Content-Disposition: attachment; filename="zenbpm-backup-<unix>.tar"`.
          content:
            application/x-tar:
              schema:
                type: string
                format: binary

  /system/v1/cluster/restore:
    post:
      operationId: restoreClusterBackup
      summary: Restore the whole cluster from a backup bundle
      description: |
        Restores every partition from a bundle produced by the backup endpoint.
        Must be sent to the current cluster raft leader (see /system/status).

        The request is synchronous: it returns once the restore reached a
        terminal state, and closing the connection cancels the restore (the
        operation record stays durable and is marked FAILED). Every phase is
        bounded by the `cluster.restore.*` deadlines, so the request always
        terminates.

        Lifecycle of one request:

        1. **Validation** — bundle entries, manifest, checksums, partition set
           and schema version are checked before anything else. A bad bundle
           is refused with `409` and nothing is recorded.
        2. **Acquisition** — a restore operation with a unique id is acquired
           atomically through raft. While another coordinator holds a live
           lease the request is refused with `409`.
        3. **Quiescing** — the coordinator waits until every partition leader
           has stopped its engine and fenced application writes.
        4. **Validating** — without `force=true` the (now fenced) cluster must
           be empty: no definitions, no instances.
        5. **Loading / reconciling** — partition images are loaded, missing
           definitions imported and message-subscription pointers rebuilt.
        6. **Resuming** — the gate is lifted and the request waits until the
           partition engines are back before answering `200`.

        A failure after partition data was touched leaves the cluster gated
        (engines stopped, mutating calls rejected). Retry the restore with
        `force=true`, or abort the operation to lift the gate explicitly.
      tags:
        - cluster-backup
      parameters:
        - name: force
          in: query
          required: false
          description: Overwrite live data. Required unless the cluster is empty.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/x-tar:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Restore completed and the partitions are serving again; the report describes what was done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreReport"
        "409":
          description: |
            Restore refused before it took ownership of the cluster (code
            `RESTORE_REFUSED`): a restore is already in progress, the bundle is
            invalid or truncated, its partition set does not match the
            cluster, its schema is newer than the binary — or (code
            `RESTORE_REFUSED`, with `operationId`) the cluster holds data and
            `force` was not set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "413":
          description: |
            The bundle, its manifest or a partition image exceeds a configured
            `cluster.restore.max*` size limit (code `RESTORE_REFUSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "500":
          description: |
            A phase of the restore failed (code `RESTORE_FAILED`). The body
            names the operation and the phase; the operation is recorded as
            FAILED and can be inspected through the operations endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "503":
          description: |
            The responding node is not the cluster raft leader (code
            `NOT_CLUSTER_LEADER`); repeat the request on the leader.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "504":
          description: |
            A phase of the restore exceeded its configured deadline (code
            `RESTORE_FAILED`), or the bundle upload did not finish within
            `cluster.restore.ingestTimeout` (code `RESTORE_REFUSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"

  /system/v1/cluster/restore/operations:
    get:
      operationId: listRestoreOperations
      summary: List restore operations
      description: |
        Returns the restore operation recorded in the cluster state — the
        current one or the most recent one — as a list (empty when the
        cluster was never restored). Readable on any node.
      tags:
        - cluster-backup
      responses:
        "200":
          description: Recorded restore operations.
          content:
            application/json:
              schema:
                type: object
                required: [operations]
                properties:
                  operations:
                    type: array
                    items:
                      $ref: "#/components/schemas/RestoreOperation"

  /system/v1/cluster/restore/operations/{operationId}:
    get:
      operationId: getRestoreOperation
      summary: Restore operation status and progress
      description: |
        Durable status of a restore operation: phase, progress, terminal
        status or error, timestamps and lease. Readable on any node.
      tags:
        - cluster-backup
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The restore operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreOperation"
        "404":
          description: No restore operation with that id is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"

  /system/v1/cluster/restore/operations/{operationId}/abort:
    post:
      operationId: abortRestoreOperation
      summary: Abort a restore operation
      description: |
        Terminates the operation regardless of its owner and lifts the cluster
        gate: engines restart and mutating calls are accepted again. Use it
        after a coordinator crash or for a failed restore that cannot be
        retried. Partially restored data is left as it is — the record keeps
        `dataModified: true` so that is visible. A completed or already
        aborted operation cannot be aborted. Must be sent to the cluster raft
        leader.
      tags:
        - cluster-backup
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Recorded on the operation as its error.
      responses:
        "200":
          description: The aborted operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreOperation"
        "404":
          description: No restore operation with that id is recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "409":
          description: The operation is already completed or aborted (code `RESTORE_ABORT_REFUSED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "503":
          description: The responding node is not the cluster raft leader (code `NOT_CLUSTER_LEADER`); repeat the request on the leader.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"
        "500":
          description: The abort could not be committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreError"

components:
  schemas:
    Health:
      type: object
      required: [status, reasons]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        reasons:
          type: array
          description: Why the node is not ready; empty when `status` is `UP`.
          items:
            type: string

    ClusterStatus:
      type: object
      required: [git, build, health, clusterConfig, partitions, nodes]
      properties:
        git:
          type: object
          required: [branch, commitId]
          properties:
            branch:
              type: string
            commitId:
              type: string
              description: Short (12 character) commit id of the running binary.
        build:
          type: object
          required: [version, time]
          properties:
            version:
              type: string
            time:
              type: string
        health:
          type: object
          required: [ok, reasons]
          properties:
            ok:
              type: boolean
              description: The same evaluation `/system/health/ready` answers with.
            reasons:
              type: array
              description: Why the node is not ready; empty when `ok` is true.
              items:
                type: string
        clusterConfig:
          type: object
          required: [desiredPartitions]
          properties:
            desiredPartitions:
              type: integer
              format: int64
        partitions:
          type: object
          description: Keyed by partition id.
          additionalProperties:
            $ref: "#/components/schemas/ClusterStatusPartition"
        nodes:
          type: object
          description: Keyed by node id.
          additionalProperties:
            $ref: "#/components/schemas/ClusterStatusNode"
        restore:
          $ref: "#/components/schemas/RestoreOperation"

    ClusterStatusPartition:
      type: object
      required: [id, leaderId]
      properties:
        id:
          type: integer
          format: int64
        leaderId:
          type: string

    ClusterStatusNode:
      type: object
      required: [id, addr, suffrage, state, role, partitions]
      properties:
        id:
          type: string
        addr:
          type: string
          description: Internal cluster (raft) address, NOT the HTTP address.
        suffrage:
          type: string
          enum: [Voter, Nonvoter, Staging]
        state:
          type: string
          description: Go stringer name of the node state.
          enum: [NodeStateError, NodeStateStarted, NodeStateShutdown]
        role:
          type: string
          description: Go stringer name of the node role.
          enum: [RoleFollower, RoleLeader]
        partitions:
          type: object
          description: Keyed by partition id.
          additionalProperties:
            $ref: "#/components/schemas/ClusterStatusNodePartition"

    ClusterStatusNodePartition:
      type: object
      required: [id, state, role]
      properties:
        id:
          type: integer
          format: int64
        state:
          type: string
          description: Go stringer name of the node-partition state.
          enum:
            - NodePartitionStateError
            - NodePartitionStateJoining
            - NodePartitionStateLeaving
            - NodePartitionStateInitializing
            - NodePartitionStateInitialized
        role:
          type: string
          description: |
            Go stringer name of the role. `Role(0)` appears while the role is
            unknown (for example right after the node's heartbeat failed).
          enum: [RoleFollower, RoleLeader, Role(0)]

    RestoreOperation:
      type: object
      description: |
        Raft-replicated record of a cluster restore. `id` and `epoch` form the
        fencing token every partition operation of the restore carries; a
        coordinator whose epoch is no longer current has been fenced out.
      required:
        - id
        - epoch
        - coordinatorId
        - phase
        - status
        - force
        - dataModified
        - gatesCluster
        - totalPartitions
        - completedPartitions
        - startedAtMillis
        - updatedAtMillis
        - leaseExpiresAtMillis
        - leaseExpired
      properties:
        id:
          type: string
        epoch:
          type: integer
          format: int64
        coordinatorId:
          type: string
          description: Id of the node that drives (or drove) the restore.
        phase:
          type: string
          description: |
            How far the restore got. PENDING: acquired; QUIESCING: waiting for
            partition leaders to stop engines and fence writes; VALIDATING:
            fenced checks (empty cluster); LOADING: partition images are being
            loaded; RECONCILING: definition sync and pointer rebuild;
            RESUMING: gate lifted, waiting for engines; DONE: completed.
          enum: [PENDING, QUIESCING, VALIDATING, LOADING, RECONCILING, RESUMING, DONE]
        status:
          type: string
          description: |
            ACTIVE while a coordinator owns the operation; COMPLETED, FAILED or
            ABORTED are terminal. A FAILED operation that already modified data
            keeps the cluster gated until a retry succeeds or it is aborted.
          enum: [ACTIVE, COMPLETED, FAILED, ABORTED]
        force:
          type: boolean
        dataModified:
          type: boolean
          description: Partition data was (at least partially) overwritten by this operation or the one it retried.
        gatesCluster:
          type: boolean
          description: Engines are stopped and mutating requests rejected because of this operation.
        totalPartitions:
          type: integer
          format: int64
        completedPartitions:
          type: integer
          format: int64
          description: Partitions whose image has been loaded.
        error:
          type: string
          description: Failure or abort reason; absent otherwise.
        startedAtMillis:
          type: integer
          format: int64
        updatedAtMillis:
          type: integer
          format: int64
        finishedAtMillis:
          type: integer
          format: int64
          description: Present once the operation is terminal.
        leaseExpiresAtMillis:
          type: integer
          format: int64
          description: Until when the coordinator's ownership is valid without a progress update.
        leaseExpired:
          type: boolean
          description: |
            The operation is ACTIVE but its coordinator stopped renewing the
            lease (crashed or lost raft leadership). A new restore may be
            started; it fences the old coordinator out.
        previousOperationId:
          type: string
          description: The operation this one retried, if any.

    RestoreReport:
      type: object
      description: |
        Summary of a completed restore. Key fields are int64; JSON consumers
        that parse numbers as IEEE-754 doubles may lose precision on keys
        above 2^53.
      required: [operationId, epoch, coordinatorId, phase, startedAtMillis, finishedAtMillis, pointersRebuilt]
      properties:
        operationId:
          type: string
          description: Id of the durable restore operation (see the operations endpoint).
        epoch:
          type: integer
          format: int64
        coordinatorId:
          type: string
        phase:
          type: string
          description: The phase the restore ended in; `DONE` for a successful restore.
          enum: [PENDING, QUIESCING, VALIDATING, LOADING, RECONCILING, RESUMING, DONE]
        startedAtMillis:
          type: integer
          format: int64
        finishedAtMillis:
          type: integer
          format: int64
        partitions:
          type: array
          items:
            type: object
            required: [partitionId, loadMillis]
            properties:
              partitionId:
                type: integer
                format: int64
              loadMillis:
                type: integer
                format: int64
        pointersRebuilt:
          type: integer
          description: Number of message-subscription pointers recreated.
        pointerConflicts:
          type: array
          description: |
            Duplicate active subscriptions found for the same (name,
            correlationKey) — an artifact of backup snapshot skew. The newest
            subscription won the pointer; losers may be instances waiting for
            a message that will not arrive; review and cancel them if needed.
          items:
            type: object
            required: [name, correlationKey, winnerKey]
            properties:
              name:
                type: string
              correlationKey:
                type: string
              winnerKey:
                type: integer
                format: int64
              loserKeys:
                type: array
                items:
                  type: integer
                  format: int64
        definitionsSynced:
          type: array
          description: |
            Definitions the reconciliation found missing on some partitions.
            A copy keeps the key and version it has on its source partition.
            A partition that already holds another definition at that version
            refuses the copy (its version history diverged before the backup);
            the restore leaves it unchanged and lists it under `conflicts`.
          items:
            type: object
            required: [key, type, toPartitions]
            properties:
              key:
                type: integer
                format: int64
              type:
                type: string
                enum: [process, dmn]
              toPartitions:
                type: array
                description: Partitions the definition was copied to; empty when every partition refused the copy.
                items:
                  type: integer
                  format: int64
              conflicts:
                type: array
                items:
                  type: object
                  required: [partition, reason]
                  properties:
                    partition:
                      type: integer
                      format: int64
                    reason:
                      type: string

    RestoreError:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          description: Machine-readable error code, e.g. RESTORE_REFUSED, RESTORE_FAILED, RESTORE_ABORT_REFUSED, NOT_CLUSTER_LEADER, NOT_FOUND.
        operationId:
          type: string
          description: Present when the restore had taken ownership of the cluster.
        phase:
          type: string
          description: The phase that failed, when known.
          enum: [PENDING, QUIESCING, VALIDATING, LOADING, RECONCILING, RESUMING, DONE]

    Error:
      type: object
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          description: Machine-readable error code.
